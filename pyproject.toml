[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-personale"
version = "0.1.0"
description = "Agente Personale Telegram — runtime (spec 01)"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot==22.8",
  "APScheduler==3.11.3",
  "SQLAlchemy==2.1.5",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".deps"]
testpaths = ["tests"]
addopts = "-q"
